<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>My Apps Store</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #1c1c1e);
    --card: var(--tg-theme-secondary-bg-color, #2c2c2e);
    --text: var(--tg-theme-text-color, #ffffff);
    --hint: var(--tg-theme-hint-color, #8e8e93);
    --btn: var(--tg-theme-button-color, #007aff);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --border: rgba(150,150,150,0.2);
    --star: #F7B801;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  body {
    background: var(--bg); color: var(--text);
    padding: 20px 16px; min-height: 100vh;
    overflow-x: hidden;
  }

  /* --- Анимации --- */
  @keyframes cardEnter {
    from { opacity: 0; transform: translateY(20px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  
  /* --- Главный экран --- */
  #mainScreen { display: block; animation: fadeIn 0.3s ease; }
  
  .header { margin-bottom: 20px; }
  .header h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 4px; }
  .header p { font-size: 14px; color: var(--hint); font-weight: 500; }

  /* Баннер */
  .featured-banner {
    background: linear-gradient(135deg, #3D348B, #F7B801);
    border-radius: 20px; padding: 20px; margin-bottom: 20px;
    color: #fff; position: relative; overflow: hidden;
    box-shadow: 0 8px 24px rgba(61,52,139,0.3);
  }
  .featured-banner::after {
    content: ''; position: absolute; right: -20px; top: -20px;
    width: 100px; height: 100px; background: rgba(255,255,255,0.2);
    border-radius: 50%; filter: blur(20px);
  }
  .featured-tag { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; opacity: 0.9; margin-bottom: 8px; display: block; }
  .featured-title { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
  .featured-desc { font-size: 13px; opacity: 0.9; margin-bottom: 12px; }
  .featured-btn {
    display: inline-block; padding: 8px 16px; background: #fff; color: #3D348B;
    text-decoration: none; border-radius: 12px; font-size: 13px; font-weight: 700;
  }
  
  .grid { display: flex; flex-direction: column; gap: 14px; }
  .app-card {
    background: var(--card); border-radius: 20px; padding: 16px;
    display: flex; align-items: center; gap: 16px;
    cursor: pointer; border: 1px solid var(--border);
    opacity: 0;
    animation: cardEnter 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s;
  }
  .app-card:active { transform: scale(0.96); }
  
  .app-icon {
    width: 64px; height: 64px; border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; overflow: hidden; background: #333;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    transition: transform 0.3s ease;
  }
  .app-card:active .app-icon { transform: scale(0.9); }
  .app-icon img { width: 100%; height: 100%; object-fit: cover; }

  .app-info { flex: 1; min-width: 0; }
  .app-name-row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .app-name { font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .app-rating-badge { font-size: 11px; font-weight: 700; color: var(--star); display: flex; align-items: center; gap: 2px; }
  .app-desc { font-size: 13px; color: var(--hint); font-weight: 500; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  
  .download-btn-small {
    background: var(--btn); color: var(--btn-text);
    border: none; border-radius: 12px;
    padding: 10px 16px; font-size: 14px; font-weight: 700;
    cursor: pointer; flex-shrink: 0;
  }

  /* --- Экран деталей --- */
  #detailScreen { display: none; animation: slideIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  .back-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: transparent; border: none; color: var(--btn);
    font-size: 16px; font-weight: 600; cursor: pointer;
    margin-bottom: 20px; padding: 5px 0;
  }
  
  .detail-header { display: flex; gap: 16px; margin-bottom: 24px; align-items: center; position: relative; }
  
  .detail-icon-glow {
    position: absolute; left: 0; top: 0; width: 96px; height: 96px;
    border-radius: 22px; z-index: -1; filter: blur(20px); opacity: 0.6;
  }
  
  .detail-icon {
    width: 96px; height: 96px; border-radius: 22px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; overflow: hidden; background: #333;
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    position: relative;
    animation: fadeIn 0.5s ease;
  }
  .detail-icon img { width: 100%; height: 100%; object-fit: cover; }

  .detail-info h1 { font-size: 24px; font-weight: 800; margin-bottom: 4px; line-height: 1.1; }
  .detail-info .dev { font-size: 14px; color: var(--hint); margin-bottom: 8px; }
  
  .rating-row { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
  .stars { color: var(--star); font-size: 16px; letter-spacing: 2px; }
  
  .download-btn-large {
    width: 100%; background: var(--btn); color: var(--btn-text);
    border: none; border-radius: 16px; padding: 16px;
    font-size: 16px; font-weight: 700; cursor: pointer;
    margin-bottom: 24px; transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .download-btn-large:active { transform: scale(0.96); }
  
  .section-title { font-size: 18px; font-weight: 700; margin-bottom: 12px; margin-top: 24px; }
  .full-desc { font-size: 14px; line-height: 1.5; color: var(--text); opacity: 0.9; margin-bottom: 24px; }
  
  .review-card { margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
  .review-header { display: flex; justify-content: space-between; margin-bottom: 6px; }
  .review-author { font-weight: 600; font-size: 14px; }
  .review-stars { font-size: 12px; color: var(--star); letter-spacing: 1px; }
  .review-text { font-size: 13px; color: var(--hint); line-height: 1.4; }

  /* --- Шторка --- */
  .sheet-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
    opacity: 0; pointer-events: none; transition: opacity 0.3s;
    z-index: 200; display: flex; align-items: flex-end;
  }
  .sheet-backdrop.show { opacity: 1; pointer-events: auto; }
  .sheet {
    background: var(--card); width: 100%;
    border-radius: 24px 24px 0 0;
    padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
    transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    text-align: center;
  }
  .sheet-backdrop.show .sheet { transform: translateY(0); }
  .sheet-icon { font-size: 48px; margin-bottom: 16px; }
  .sheet-title { font-size: 20px; font-weight: 800; margin-bottom: 8px; }
  .sheet-text { font-size: 14px; color: var(--hint); line-height: 1.5; margin-bottom: 24px; }
  .sheet-actions { display: flex; gap: 12px; }
  .sheet-actions button {
    flex: 1; padding: 16px; border-radius: 14px; border: none;
    font-size: 16px; font-weight: 700; cursor: pointer;
  }
  .sheet-actions .cancel { background: var(--bg); color: var(--text); }
  .sheet-actions .confirm { background: var(--btn); color: var(--btn-text); }
</style>
</head>
<body>

<div id="mainScreen">
  <div class="header">
    <h1>Мои приложения</h1>
    <p>Только лучшие продукты от Raze Studio</p>
  </div>
  
  <!-- Баннер -->
  <div class="featured-banner">
    <span class="featured-tag">Выбор редакции</span>
    <div class="featured-title">My Money</div>
    <div class="featured-desc">Лучший помощник для контроля карманных расходов</div>
    <a href="#" class="featured-btn" onclick="openFeatured(); return false;">Скачать</a>
  </div>

  <div class="grid" id="appsGrid"></div>
</div>

<div id="detailScreen">
  <button class="back-btn" onclick="goHome()">← Назад в каталог</button>
  
  <div class="detail-header">
    <div class="detail-icon-glow" id="dGlow"></div>
    <div class="detail-icon" id="dIcon"></div>
    <div class="detail-info">
      <h1 id="dName"></h1>
      <div class="dev" id="dDev"></div>
      <div class="rating-row">
        <span id="dRating"></span>
        <span class="stars" id="dStars"></span>
        <span id="dReviewsCount" style="color: var(--hint); font-weight: 500;"></span>
      </div>
    </div>
  </div>

  <button class="download-btn-large" onclick="showDownloadSheet()">Скачать</button>
  
  <div class="section-title">Описание</div>
  <div class="full-desc" id="dFullDesc"></div>
  
  <div class="section-title">Отзывы</div>
  <div id="reviewsList"></div>
</div>

<div class="sheet-backdrop" id="downloadSheet" onclick="if(event.target===this)closeDownloadSheet()">
  <div class="sheet">
    <div class="sheet-icon">📥</div>
    <div class="sheet-title">Переход в Telegram</div>
    <div class="sheet-text">Сейчас откроется наш Telegram-канал. Нажми «Скачать файл» в канале, чтобы установить приложение.</div>
    <div class="sheet-actions">
      <button class="cancel" onclick="closeDownloadSheet()">Отмена</button>
      <button class="confirm" onclick="confirmDownload()">Перейти</button>
    </div>
  </div>
</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.expand();
  tg.ready();
  
  tg.BackButton.onClick(() => {
    goHome();
  });

    const apps = [
    {
      id: 'deco',
      name: 'Deco-Island',
      desc: 'Тебе нужно делать всё, чтобы выжить: у тебя есть немного денег, и ты можешь заработать ещё — купить еду или улучшить свою базу!',
      icon: 'https://i.postimg.cc/3xd5qYm5/IMG-20261108-194254-964.jpg',
      url: 'https://t.me/RazeRealLife/49',
      developer: 'Deco-Deni', 
      rating: '4.5',
      reviewsCount: '89',
      color: '#8B4513',
      fullDesc: 'Добро пожаловать на остров! Тебе нужно делать всё, чтобы выжить: у тебя есть немного денег, и ты можешь заработать ещё — купить еду или улучшить свою базу для выживания! Исследуй, развивайся и не дай себе пропасть в этом суровом месте.',
      reviews: [
        { author: 'Игорь', stars: '★★★★★', text: 'Очень интересная игра на выживание. Затягивает!' },
        { author: 'Данил', stars: '★★★★☆', text: 'Норм, но хотелось бы больше ресурсов.' }
      ]
    },
    {
      id: 'magnat',
      name: 'Номерной Магнат',
      desc: 'Кликер-бизнес, где ты скупаешь красивые номера, прокачиваешь их и продаешь втридорога.',
      icon: 'https://i.postimg.cc/LXX7tzd1/Screenshot-2026-09-18-07-40-36-183-com-camerasideas-trimmer-edit.jpg', 
      url: 'https://t.me/NomernoyMagnat/3',
      developer: 'Raze Studio',
      rating: '4.8',
      reviewsCount: '1 204',
      color: '#333',
      fullDesc: 'Погрузись в мир автомобильных номеров! В этой увлекательной игре-кликере тебе предстоит стать настоящим магнатом. Скупай редкие и красивые автомобильные номера, прокачивай свою гарантию, покупай бусты и перепродавай номера другим игрокам за огромные деньги. Идеальный тайм-киллер с простым геймплеем и глубокой экономикой.',
      reviews: [
        { author: 'Максим', stars: '★★★★★', text: 'Затягивает с первых минут. Уже накопил на золотой номер!' },
        { author: 'Алексей', stars: '★★★★☆', text: 'Норм игра, но иногда долго копить на дорогие бусты. В целом топ.' },
        { author: 'Иван', stars: '★★★★★', text: 'Лучший кликер про номера, что я видел. Интерфейс огонь.' }
      ]
    },
    {
      id: 'moneybox',
      name: 'My Moneybox',
      desc: 'Удобный счетчик наличных. Быстро посчитай, сколько у тебя банкнот и монет в кошельке.',
      icon: 'https://i.postimg.cc/nrXyJq0t/IMG-20261107-211049.jpg',
      url: 'https://t.me/MyMoneyboxApp/3',
      developer: 'Raze Studio',
      rating: '4.7',
      reviewsCount: '342',
      color: '#ff8c00',
      fullDesc: 'Сколько у тебя реально денег в кармане прямо сейчас? My Moneybox поможет быстро посчитать физическую наличность. Просто нажимай на плюсики напротив банкнот и монет, и приложение мгновенно покажет общую сумму. Больше не нужно пересчитывать мелочь вручную перед походом в магазин.',
      reviews: [
        { author: 'Светлана', stars: '★★★★★', text: 'Очень удобно для копилки. Просто и со вкусом.' },
        { author: 'Олег', stars: '★★★★☆', text: 'Быстро считает. Хотелось бы еще функцию сдачи.' }
      ]
    },
    {
      id: 'mymoney',
      name: 'My Money',
      desc: 'Твой личный финансовый помощник. Следи за балансом, записывай траты и копи на цели. Офлайн.',
      icon: 'https://i.postimg.cc/zfq4fs0Q/IMG-20261026-203103-287.jpg',
      url: 'https://t.me/MyMoneyAppRaze/30',
      developer: 'Raze Studio',
      rating: '4.9',
      reviewsCount: '856',
      color: '#2b6cb0',
      fullDesc: 'Надоело гадать, куда уходят карманные деньги? My Money — это простой и красивый трекер расходов и доходов, созданный специально для школьников и студентов. Записывай траты за 10 секунд, ставь финансовые цели (наушники, игры, подарки) и смотри на наглядных графиках, куда утекает твой бюджет. Все данные хранятся только на твоем устройстве, никакой регистрации и серверов.',
      reviews: [
        { author: 'Анна', stars: '★★★★★', text: 'Очень красивый дизайн! Наконец-то начала копить на мечту.' },
        { author: 'Дмитрий', stars: '★★★★☆', text: 'Минус в том, что нет облака, но зато безопасно. Приложение топ.' },
        { author: 'Егор', stars: '★★★★☆', text: 'Классная статистика по неделям. Сразу видно, где перетратил.' }
      ]
    },
    {
      id: 'geoquiz',
      name: 'GeoQuiz',
      desc: 'Проверь свои знания географии! Увлекательная викторина с флагами и столицами.',
      icon: 'https://i.postimg.cc/8522Tj3H/i-(25).jpg',
      url: 'https://t.me/Raze_Moff_Game/61',
      developer: 'Raze Studio',
      rating: '4.6',
      reviewsCount: '128',
      color: '#4CAF50',
      fullDesc: 'Проверь свои знания географии! Увлекательная викторина с флагами и столицами стран мира. Играй и расширяй свой кругозор.',
      reviews: [
        { author: 'Павел', stars: '★★★★★', text: 'Крутая викторина, узнал много нового!' },
        { author: 'Мария', stars: '★★★★☆', text: 'Иногда сложно, но затягивает.' }
      ]
    }
  ];
  let currentAppUrl = '';

  const grid = document.getElementById('appsGrid');
  apps.forEach((app, index) => {
    const card = document.createElement('div');
    card.className = 'app-card';
    card.style.animationDelay = `${index * 0.1}s`;
    
    card.innerHTML = `
      <div class="app-icon"><img src="${app.icon}" alt="${app.name}" loading="lazy"></div>
      <div class="app-info">
        <div class="app-name-row">
          <div class="app-name">${app.name}</div>
          <div class="app-rating-badge">★ ${app.rating}</div>
        </div>
        <div class="app-desc">${app.desc}</div>
      </div>
      <button class="download-btn-small" onclick="event.stopPropagation(); openLink('${app.url}')">Скачать</button>
    `;
    card.onclick = () => showDetail(index);
    grid.appendChild(card);
  });

  function openFeatured() {
    const idx = apps.findIndex(a => a.id === 'mymoney');
    if (idx !== -1) showDetail(idx);
  }

  function goHome() {
    const main = document.getElementById('mainScreen');
    const detail = document.getElementById('detailScreen');
    
    detail.style.opacity = '0';
    detail.style.transform = 'translateY(20px)';
    
    setTimeout(() => {
      detail.style.display = 'none';
      detail.style.opacity = '';
      detail.style.transform = '';
      
      main.style.display = 'block';
      main.style.animation = 'none';
      main.offsetHeight; 
      main.style.animation = '';
      
      tg.BackButton.hide();
      window.scrollTo(0, 0);
    }, 300);
  }

  function showDetail(index) {
    const app = apps[index];
    currentAppUrl = app.url;

    document.getElementById('dIcon').innerHTML = `<img src="${app.icon}" alt="${app.name}">`;
    document.getElementById('dGlow').style.background = app.color;
    document.getElementById('dName').textContent = app.name;
    document.getElementById('dDev').textContent = app.developer;
    document.getElementById('dRating').textContent = app.rating;
    document.getElementById('dStars').textContent = '★★★★★';
    document.getElementById('dReviewsCount').textContent = `(${app.reviewsCount})`;
    document.getElementById('dFullDesc').textContent = app.fullDesc;

    const reviewsList = document.getElementById('reviewsList');
    reviewsList.innerHTML = '';
    app.reviews.forEach(review => {
      const rCard = document.createElement('div');
      rCard.className = 'review-card';
      rCard.innerHTML = `
        <div class="review-header">
          <span class="review-author">${review.author}</span>
          <span class="review-stars">${review.stars}</span>
        </div>
        <div class="review-text">${review.text}</div>
      `;
      reviewsList.appendChild(rCard);
    });

    const main = document.getElementById('mainScreen');
    const detail = document.getElementById('detailScreen');

    main.style.display = 'none';
    detail.style.display = 'block';
    
    detail.style.animation = 'none';
    detail.offsetHeight; 
    detail.style.animation = '';
    
    tg.BackButton.show();
    window.scrollTo(0, 0);
  }

  function showDownloadSheet() {
    document.getElementById('downloadSheet').classList.add('show');
  }

  function closeDownloadSheet() {
    document.getElementById('downloadSheet').classList.remove('show');
  }

  function confirmDownload() {
    closeDownloadSheet();
    setTimeout(() => {
      openLink(currentAppUrl);
    }, 300);
  }

  function openLink(url) {
    if (tg.openTelegramLink) {
      tg.openTelegramLink(url);
    } else {
      window.open(url, '_blank');
    }
  }
</script>
</body>
</html>
